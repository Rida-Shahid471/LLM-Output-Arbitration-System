services:
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      FACTUAL_PROVIDER: ${FACTUAL_PROVIDER:-}
      FACTUAL_MODEL: ${FACTUAL_MODEL:-}
      LOGICAL_PROVIDER: ${LOGICAL_PROVIDER:-}
      LOGICAL_MODEL: ${LOGICAL_MODEL:-}
      COMPLETENESS_PROVIDER: ${COMPLETENESS_PROVIDER:-}
      COMPLETENESS_MODEL: ${COMPLETENESS_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      MAX_PROVIDER_INPUT_CHARS: ${MAX_PROVIDER_INPUT_CHARS:-100000}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-100000}
      ANTHROPIC_MAX_INPUT_CHARS: ${ANTHROPIC_MAX_INPUT_CHARS:-100000}
      OLLAMA_MAX_INPUT_CHARS: ${OLLAMA_MAX_INPUT_CHARS:-100000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-2048}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-2048}
      FACTUAL_THRESHOLD: ${FACTUAL_THRESHOLD:-3}
      LOGICAL_THRESHOLD: ${LOGICAL_THRESHOLD:-3}
      COMPLETENESS_THRESHOLD: ${COMPLETENESS_THRESHOLD:-3}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-20000}
      MAX_ANSWER_CHARS: ${MAX_ANSWER_CHARS:-50000}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_PATH: /app/data/arbitrations.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - arbitration-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live')"]
      interval: 20s
      timeout: 5s
      retries: 3
  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      ARBITRATION_API_URL: http://api:8000
      ARBITRATION_PROVIDER: ${LLM_PROVIDER:-mock}
      ARBITRATION_FACTUAL_PROVIDER: ${FACTUAL_PROVIDER:-}
      ARBITRATION_LOGICAL_PROVIDER: ${LOGICAL_PROVIDER:-}
      ARBITRATION_COMPLETENESS_PROVIDER: ${COMPLETENESS_PROVIDER:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-2}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  arbitration-data:
